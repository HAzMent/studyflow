<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Reset Password — StudyFlow
</title>

<link
  rel="icon"
  href="/studyflow-icon.svg"
>

<link
  rel="stylesheet"
  href="/password-pages.css"
>

</head>


<body>

<div class="auth-page-card">

<a
  href="/"
  class="auth-logo"
>
🎓 StudyFlow
</a>


<div class="auth-icon">
🔑
</div>


<h1>
Create a new password
</h1>


<p class="subtitle">
Choose a strong new password
for your StudyFlow account.
</p>


<form id="resetForm">

<label>
New password
</label>

<input
  id="password"
  type="password"
  minlength="8"
  placeholder="At least 8 characters"
  required
>


<label>
Confirm password
</label>

<input
  id="confirmPassword"
  type="password"
  minlength="8"
  placeholder="Repeat password"
  required
>


<button type="submit">
Reset Password
</button>

</form>


<div
  id="message"
  class="message hidden"
></div>


<a
  class="back-link"
  href="/app"
>
← Back to StudyFlow
</a>

</div>


<script>

const params =
  new URLSearchParams(
    location.search
  );


const token =
  params.get(
    "token"
  );


const form =
  document.getElementById(
    "resetForm"
  );


const message =
  document.getElementById(
    "message"
  );


if(!token){

  message.textContent =
    "This reset link is invalid.";


  message.className =
    "message error";


  form.style.display =
    "none";

}


form.addEventListener(
  "submit",

  async event => {

    event.preventDefault();


    const password =
      document.getElementById(
        "password"
      ).value;


    const confirm =
      document.getElementById(
        "confirmPassword"
      ).value;


    if(
      password !==
      confirm
    ){

      message.textContent =
        "Passwords do not match.";


      message.className =
        "message error";


      return;

    }


    const button =
      form.querySelector(
        "button"
      );


    button.disabled =
      true;


    button.textContent =
      "Updating...";


    try{

      const response =
        await fetch(
          "/api/reset-password",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                token,

                password

              })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Reset failed."
        );

      }


      message.textContent =
        "✅ Password changed. You can now log in.";


      message.className =
        "message success";


      form.style.display =
        "none";


      setTimeout(
        () => {

          location.href =
            "/app";

        },
        1800
      );


    }catch(error){

      message.textContent =
        error.message;


      message.className =
        "message error";

    }


    button.disabled =
      false;


    button.textContent =
      "Reset Password";

  }
);

</script>

</body>

</html>
