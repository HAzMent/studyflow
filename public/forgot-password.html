<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Forgot Password — StudyFlow
</title>

<link
  rel="icon"
  href="/studyflow-icon.svg"
>

<link
  rel="stylesheet"
  href="/password-pages.css"
>

</head>


<body>

<div class="auth-page-card">

<a
  href="/"
  class="auth-logo"
>
🎓 StudyFlow
</a>


<div class="auth-icon">
🔐
</div>


<h1>
Forgot password?
</h1>


<p class="subtitle">

Enter the email associated with
your StudyFlow account.

</p>


<form id="forgotForm">

<label>
Email
</label>

<input
  id="email"
  type="email"
  placeholder="you@example.com"
  required
>


<button type="submit">
Send Reset Link
</button>

</form>


<div
  id="message"
  class="message hidden"
></div>


<a
  class="back-link"
  href="/app"
>
← Back to StudyFlow
</a>

</div>


<script>

const form =
  document.getElementById(
    "forgotForm"
  );


form.addEventListener(
  "submit",

  async event => {

    event.preventDefault();


    const button =
      form.querySelector(
        "button"
      );


    button.disabled =
      true;


    button.textContent =
      "Sending...";


    const message =
      document.getElementById(
        "message"
      );


    try{

      const response =
        await fetch(
          "/api/forgot-password",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                email:
                  document
                  .getElementById(
                    "email"
                  )
                  .value

              })

          }
        );


      const data =
        await response.json();


      message.textContent =
        data.message ||
        "Check your email for password reset instructions.";


      message.className =
        "message success";


      form.reset();


    }catch(error){

      message.textContent =
        "Something went wrong. Please try again.";


      message.className =
        "message error";

    }


    button.disabled =
      false;


    button.textContent =
      "Send Reset Link";

  }
);

</script>

</body>

</html>
